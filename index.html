<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141a16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plants">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Plant Care</title>
<style>
:root{
  --bg:#f3efe6;--card:#fffdf8;--ink:#1e2a21;--muted:#6a7369;--line:#e3ddd0;
  --green:#2f5d3a;--green2:#4d8a5b;--greenbg:#e4efe2;
  --blue:#28588a;--bluebg:#e3edf7;--amber:#8a5a10;--amberbg:#fbefd8;
  --red:#9b3b2b;--redbg:#f8e3de;--onbtn:#fffdf8;
  --shadow:0 1px 2px rgba(30,42,33,.05),0 4px 14px rgba(30,42,33,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a16;--card:#1d2520;--ink:#e8ede6;--muted:#9aa59b;--line:#2c362f;
  --green:#8cc79a;--green2:#6fb07f;--greenbg:#1f3325;
  --blue:#8fb8e3;--bluebg:#1b2a3a;--amber:#e6b866;--amberbg:#352a15;
  --red:#e79a8a;--redbg:#3a1f1a;--onbtn:#141a16;--shadow:none;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(78px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:4px 16px 24px}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 0 12px}
h1{font:700 34px/1.1 ui-serif,"New York",Georgia,serif;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;font-weight:600;margin-bottom:2px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.section-title{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:20px 4px 8px}
.ttl{font-weight:650}
.det{color:var(--muted);font-size:14px;margin-top:2px}
.muted{color:var(--muted)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;background:var(--green);color:var(--onbtn)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--redbg);color:var(--red)}
.btn.wide{display:block;width:100%;padding:12px;margin-top:12px;font-size:15px}
.link{background:none;border:0;padding:0;color:var(--green);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;font-size:18px;display:grid;place-items:center;flex:none}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* weather */
.wxtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wxtop .big{font-size:36px;line-height:1}
.wxtop>div:nth-child(2){flex:1;min-width:0}
.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;border-top:1px solid var(--line);padding-top:10px}
.fday .d{font-size:12px;color:var(--muted);font-weight:700}
.fday .i{font-size:22px;line-height:1.4}
.fday .t{font-size:13px;font-weight:600}
.fday .lo{color:var(--muted);font-weight:500}
.fday .r{font-size:11px;color:var(--blue);font-weight:600;min-height:15px}
.notice{margin-top:10px;font-size:13px;color:var(--amber);background:var(--amberbg);padding:8px 10px;border-radius:10px}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--green2)}
.task .ic{font-size:24px;line-height:1.1}
.task .body{flex:1;min-width:0}
.task.cold,.task.storm,.task.soak{border-left-color:var(--blue)}
.task.heat{border-left-color:var(--red)}
.task.rain{border-left-color:var(--blue)}
.task.nice{border-left-color:var(--amber)}
.allgood{text-align:center;padding:22px 14px}
.allgood .e{font-size:34px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0;padding-top:0}
.row:last-child{padding-bottom:0}
.welcome ol{margin:8px 0 0;padding-left:22px}
.welcome li{margin:6px 0}
.welcome li.done{color:var(--muted);text-decoration:line-through}

/* plants */
.plant{display:flex;gap:12px;align-items:center;cursor:pointer}
.plant .em{width:48px;height:48px;border-radius:12px;background:var(--greenbg);display:grid;place-items:center;font-size:26px;flex:none}
.plant .body{flex:1;min-width:0}
.plant .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plant .qa{display:flex;gap:6px}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--greenbg);color:var(--green);font-weight:600;margin-right:4px}
.badge.out{background:var(--amberbg);color:var(--amber)}
.due{color:var(--blue);font-weight:600}
.over{color:var(--red);font-weight:600}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .e{font-size:44px}

/* settings */
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow input{flex:1}
.results{margin-top:8px}
.results button{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 4px}
.results button:first-child{border-top:0}
.results small{color:var(--muted)}
.howto{margin:0;padding-left:20px;font-size:14px;color:var(--muted)}
.howto li{margin:6px 0}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center;z-index:20}
.overlay.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:20px 20px 0 0;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{position:sticky;top:0;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;z-index:1}
.sheethead .link{text-decoration:none;font-size:16px}
.sheethead .cancel{color:var(--muted);font-weight:500}
.sheettitle{font-weight:700}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input.err{border-color:var(--red)}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--green);color:var(--onbtn)}
label.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:8px 0 0;color:var(--ink);font-size:15px;font-weight:500}
.tog .th{display:block;font-size:12px;color:var(--muted);margin-top:2px}
input.sw{width:50px;height:30px;padding:0;border-radius:999px;background:var(--line);position:relative;flex:none;border:0;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
input.sw:checked{background:var(--green2)}
input.sw:checked::after{transform:translateX(20px)}

/* nav + toast */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:11px;gap:1px;padding:4px 22px;font-weight:600}
nav.tabs .ti{font-size:22px;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--green)}
nav.tabs button.on .ti{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.2s;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:none;border:0;color:var(--bg);font-weight:700;text-decoration:underline;padding:0}
</style>
</head>
<body>
<div class="wrap" id="view"></div>

<nav class="tabs">
  <button data-act="tab" data-tab="today"><span class="ti">☀️</span>Today</button>
  <button data-act="tab" data-tab="plants"><span class="ti">🪴</span>Plants</button>
  <button data-act="tab" data-tab="settings"><span class="ti">⚙️</span>Settings</button>
</nav>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo" hidden>Undo</button></div>

<script>
/* ---------- Plant types: general starting points the user can adjust ---------- */
const PRESETS = {
  other:     {label:'Other / not listed',  emoji:'🌱', waterEvery:7,  minTemp:50, rainOk:true,  likesOutdoors:false},
  basil:     {label:'Basil',               emoji:'🌿', waterEvery:2,  minTemp:50, rainOk:true,  likesOutdoors:true},
  tomato:    {label:'Tomato',              emoji:'🍅', waterEvery:2,  minTemp:50, rainOk:true,  likesOutdoors:true},
  rosemary:  {label:'Rosemary',            emoji:'🌿', waterEvery:7,  minTemp:30, rainOk:true,  likesOutdoors:true},
  citrus:    {label:'Citrus tree',         emoji:'🍋', waterEvery:5,  minTemp:40, rainOk:true,  likesOutdoors:true},
  geranium:  {label:'Geranium',            emoji:'🌺', waterEvery:4,  minTemp:40, rainOk:true,  likesOutdoors:true},
  fern:      {label:'Fern',                emoji:'🌿', waterEvery:3,  minTemp:50, rainOk:true,  likesOutdoors:true},
  monstera:  {label:'Monstera',            emoji:'🪴', waterEvery:7,  minTemp:55, rainOk:true,  likesOutdoors:true},
  pothos:    {label:'Pothos',              emoji:'🪴', waterEvery:7,  minTemp:50, rainOk:true,  likesOutdoors:false},
  snake:     {label:'Snake plant',         emoji:'🪴', waterEvery:14, minTemp:50, rainOk:false, likesOutdoors:false},
  fiddle:    {label:'Fiddle leaf fig',     emoji:'🌳', waterEvery:7,  minTemp:55, rainOk:true,  likesOutdoors:false},
  peacelily: {label:'Peace lily',          emoji:'🌱', waterEvery:5,  minTemp:55, rainOk:true,  likesOutdoors:false},
  succulent: {label:'Succulent / cactus',  emoji:'🌵', waterEvery:14, minTemp:45, rainOk:false, likesOutdoors:true},
};
const ORDER = {cold:0, storm:1, soak:2, heat:3, water:4, rain:5, nice:6};

/* ---------- Storage ---------- */
const KEY = 'plantcare.v1';
function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch(e){ return null; } }
let state = Object.assign({plants:[], location:null, weather:null, dismissed:{}}, load() || {});
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r = n => Math.round(n);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const clamp = (n,a,b) => Math.min(b, Math.max(a, n));
function ymd(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function today(){ return ymd(new Date()); }
function dayNum(s){ const [y,m,d] = s.split('-').map(Number); return Date.UTC(y,m-1,d)/864e5; }
function daysBetween(a,b){ return Math.round(dayNum(b) - dayNum(a)); }
function addDays(s,k){ return new Date((dayNum(s)+k)*864e5).toISOString().slice(0,10); }
function weekday(s, style='long'){ return new Date(dayNum(s)*864e5).toLocaleDateString('en-US',{weekday:style,timeZone:'UTC'}); }
function dayWord(s){ const n = daysBetween(today(), s); return n===0 ? 'today' : n===1 ? 'tomorrow' : weekday(s); }
// A day's low usually happens early that morning, so the low for date D is "the night before D".
function nightWord(s){ const n = daysBetween(today(), s); return n<=1 ? 'tonight' : n===2 ? 'tomorrow night' : weekday(addDays(s,-1)) + ' night'; }
function wx(code){
  if(code===0) return ['☀️','Clear'];
  if(code<=2) return ['🌤️','Partly cloudy'];
  if(code===3) return ['☁️','Cloudy'];
  if(code===45||code===48) return ['🌫️','Foggy'];
  if(code>=51&&code<=57) return ['🌦️','Drizzle'];
  if(code>=61&&code<=67) return ['🌧️','Rain'];
  if(code>=71&&code<=77) return ['🌨️','Snow'];
  if(code>=80&&code<=82) return ['🌦️','Showers'];
  if(code>=85&&code<=86) return ['🌨️','Snow showers'];
  if(code>=95) return ['⛈️','Thunderstorms'];
  return ['🌡️','—'];
}
const isStorm = c => c >= 95;
const emojiFor = p => (PRESETS[p.kind] || PRESETS.other).emoji;
function daysUntilWater(p){ return p.lastWatered ? p.waterEvery - daysBetween(p.lastWatered, today()) : 0; }
function waterText(left){
  if(left < 0) return `<span class="over">Water ${-left} day${left===-1?'':'s'} overdue</span>`;
  if(left === 0) return `<span class="due">Water today</span>`;
  if(left === 1) return 'Water tomorrow';
  return `Water in ${left} days`;
}

/* ---------- Weather (Open-Meteo, free, no account) ---------- */
let weatherStatus = '';
async function fetchWeather(force){
  if(!state.location) return;
  const w = state.weather, loc = state.location;
  const fresh = w && w.lat === loc.lat && w.lon === loc.lon && Date.now() - w.fetchedAt < 60*60*1000 && w.days.some(d => d.date === today());
  if(fresh && !force) return;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${loc.lat}&longitude=${loc.lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max`
    + `&past_days=1&forecast_days=7&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph&timezone=auto`;
  try {
    const res = await fetch(url);
    if(!res.ok) throw new Error(res.status);
    const d = (await res.json()).daily;
    state.weather = {fetchedAt: Date.now(), lat: loc.lat, lon: loc.lon, days: d.time.map((t,i) => ({
      date: t, code: d.weather_code[i], hi: d.temperature_2m_max[i], lo: d.temperature_2m_min[i],
      rain: d.precipitation_sum[i] ?? 0, pop: d.precipitation_probability_max[i] ?? 0, wind: d.wind_speed_10m_max[i] ?? 0
    }))};
    weatherStatus = '';
    save();
  } catch(e) {
    weatherStatus = state.weather ? 'Couldn’t reach the weather service, so this is the last forecast saved.' : 'Couldn’t reach the weather service. Check your connection and tap ↻.';
  }
  render();
}
function wxWindow(){
  const days = state.weather?.days || [];
  const ti = days.findIndex(d => d.date === today());
  if(ti < 0) return null;
  return {days, ti, yesterday: days[ti-1] || null, daytime: days.slice(ti, ti+3), nights: days.slice(ti+1, ti+4)};
}

/* ---------- The brain: what needs doing today ---------- */
function computeTasks(){
  const t = today(), W = wxWindow(), out = [];
  for(const p of state.plants){
    const nm = p.name, outside = p.spot === 'outdoor';
    const add = o => { o.plant = p; o.key = `${o.kind}:${p.id}`; if(o.dismiss && state.dismissed[o.key] === t) return; out.push(o); };

    if(W && p.portable && outside){
      const cold = W.nights.find(d => d.lo < p.minTemp);
      if(cold){
        add({kind:'cold', icon:'🥶', title:`Bring ${nm} inside`, detail:`Low of ${r(cold.lo)}° ${nightWord(cold.date)}, below its ${p.minTemp}° limit.`, action:'movein', label:'Moved inside', dismiss:true});
      } else {
        const storm = W.daytime.slice(0,2).find(d => isStorm(d.code) || d.wind >= 30);
        const soak = !p.rainOk && W.daytime.slice(0,2).find(d => d.rain >= 0.25 && d.pop >= 50);
        if(storm) add({kind:'storm', icon:'⛈️', title:`Shelter ${nm}`, detail:`${isStorm(storm.code) ? 'Thunderstorms' : `Strong winds (up to ${r(storm.wind)} mph)`} expected ${dayWord(storm.date)}.`, action:'movein', label:'Moved inside', dismiss:true});
        else if(soak) add({kind:'soak', icon:'🌧️', title:`Keep ${nm} out of the rain`, detail:`About ${soak.rain.toFixed(1)}" of rain expected ${dayWord(soak.date)}, and it prefers to stay dry.`, action:'movein', label:'Moved inside', dismiss:true});
        const hot = W.daytime.slice(0,2).find(d => d.hi >= 95);
        if(hot) add({kind:'heat', icon:'🥵', title:`Give ${nm} some shade`, detail:`High of ${r(hot.hi)}° ${dayWord(hot.date)}. Afternoon shade and an extra soil check will help.`, dismiss:true});
      }
    }

    if(W && p.portable && !outside && p.likesOutdoors && W.nights.length === 3 && W.daytime.length === 3){
      const ok = W.nights.every(d => d.lo >= p.minTemp + 5) &&
                 W.daytime.every(d => d.hi <= 90 && !isStorm(d.code) && d.wind < 25 && (p.rainOk || d.rain < 0.1));
      if(ok){
        const minLo = Math.min(...W.nights.map(d => d.lo));
        add({kind:'nice', icon:'🌤️', title:`Nice stretch for ${nm} outside`, detail:`Nights stay at ${r(minLo)}° or warmer through ${weekday(W.daytime[2].date)}.`, action:'moveout', label:'Moved outside', dismiss:true});
      }
    }

    const left = daysUntilWater(p);
    if(left <= 0){
      const yRain = W?.yesterday?.rain || 0;
      if(outside && yRain >= 0.25)
        add({kind:'rain', icon:'🌦️', title:`${nm} may not need water`, detail:`${yRain.toFixed(1)}" of rain fell yesterday. Check the soil before watering.`, action:'water', label:'Mark as watered'});
      else
        add({kind:'water', icon:'💧', title:`Water ${nm}`, detail: left < 0 ? `${-left} day${left===-1?'':'s'} overdue` : 'Due today', action:'water', label:'Watered', over:-left});
    }
  }
  return out.sort((a,b) => ORDER[a.kind] - ORDER[b.kind] || (b.over||0) - (a.over||0));
}

/* ---------- Views ---------- */
let tab = 'today', searchQ = '', searchResults = [], searching = false;

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#view').innerHTML = tab === 'today' ? viewToday() : tab === 'plants' ? viewPlants() : viewSettings();
}

function viewToday(){
  const dateLabel = new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  let h = `<header class="top"><div><div class="sub">${dateLabel}</div><h1>Today</h1></div>
    ${state.location ? `<button class="chip" data-act="tab" data-tab="settings">📍 ${esc(state.location.name)}</button>` : ''}</header>`;

  if(!state.location || !state.plants.length){
    h += `<div class="card welcome"><div class="ttl">Welcome 🌱 Two quick steps:</div><ol>
      <li class="${state.location?'done':''}">${state.location ? 'Location set' : '<button class="link" data-act="tab" data-tab="settings">Set your location</button> for weather alerts'}</li>
      <li class="${state.plants.length?'done':''}">${state.plants.length ? 'Plants added' : '<button class="link" data-act="add">Add your first plant</button>'}</li></ol></div>`;
  }
  if(state.location) h += weatherCard();
  if(!state.plants.length) return h;

  const tasks = computeTasks();
  h += `<div class="section-title">To do</div>`;
  h += tasks.length ? tasks.map(taskHTML).join('')
    : `<div class="card allgood"><div class="e">🌿</div><div class="ttl">All caught up</div><div class="det">Nothing needs doing today.</div></div>`;

  const upcoming = state.plants.map(p => ({p, left: daysUntilWater(p)})).filter(x => x.left > 0).sort((a,b) => a.left - b.left).slice(0,6);
  if(upcoming.length){
    h += `<div class="section-title">Coming up</div><div class="card">` + upcoming.map(({p,left}) =>
      `<div class="row"><span>${emojiFor(p)} ${esc(p.name)}</span><span class="muted">${left===1 ? 'water tomorrow' : `water ${weekday(addDays(today(), left))}`}</span></div>`).join('') + `</div>`;
  }
  return h;
}

function weatherCard(){
  const W = wxWindow();
  if(!W) return `<div class="card"><div class="muted">${esc(weatherStatus || 'Loading forecast…')}</div>${weatherStatus ? '<div class="acts"><button class="btn ghost" data-act="refresh">Try again</button></div>' : ''}</div>`;
  const d0 = W.days[W.ti], [ic, lab] = wx(d0.code);
  const updated = new Date(state.weather.fetchedAt).toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'});
  const strip = W.days.slice(W.ti, W.ti+5).map((d,i) => `<div class="fday"><div class="d">${i===0 ? 'Today' : weekday(d.date,'short')}</div>
    <div class="i">${wx(d.code)[0]}</div><div class="t">${r(d.hi)}° <span class="lo">${r(d.lo)}°</span></div>
    <div class="r">${d.pop >= 30 ? `💧${d.pop}%` : ''}</div></div>`).join('');
  return `<div class="card"><div class="wxtop"><div class="big">${ic}</div>
    <div><div class="ttl">${lab} · ${r(d0.hi)}° / ${r(d0.lo)}°</div><div class="det">Updated ${updated}</div></div>
    <button class="iconbtn" data-act="refresh" aria-label="Refresh forecast">↻</button></div>
    <div class="forecast">${strip}</div>${weatherStatus ? `<div class="notice">${esc(weatherStatus)}</div>` : ''}</div>`;
}

function taskHTML(t){
  return `<div class="card task ${t.kind}"><div class="ic">${t.icon}</div><div class="body">
    <div class="ttl">${esc(t.title)}</div><div class="det">${esc(t.detail)}</div>
    <div class="acts">${t.action ? `<button class="btn" data-act="${t.action}" data-id="${t.plant.id}">${t.label}</button>` : ''}
    ${t.dismiss ? `<button class="btn ghost" data-act="dismiss" data-key="${t.key}">Not today</button>` : ''}</div></div></div>`;
}

function viewPlants(){
  let h = `<header class="top"><div><div class="sub">${state.plants.length} plant${state.plants.length===1?'':'s'}</div><h1>My plants</h1></div>
    <button class="btn" data-act="add">+ Add plant</button></header>`;
  if(!state.plants.length) return h + `<div class="empty"><div class="e">🪴</div><p>No plants yet.<br>Add one to start getting reminders.</p></div>`;
  const list = [...state.plants].sort((a,b) => daysUntilWater(a) - daysUntilWater(b) || a.name.localeCompare(b.name));
  return h + list.map(p => {
    const out = p.spot === 'outdoor';
    return `<div class="card plant" data-act="edit" data-id="${p.id}"><div class="em">${emojiFor(p)}</div>
      <div class="body"><div class="ttl">${esc(p.name)}</div>
      <div class="det"><span class="badge ${out?'out':''}">${out ? 'Outdoors' : 'Indoors'}</span>${waterText(daysUntilWater(p))}</div></div>
      <div class="qa"><button class="iconbtn" data-act="water" data-id="${p.id}" aria-label="Mark ${esc(p.name)} watered">💧</button>
      ${p.portable ? `<button class="iconbtn" data-act="${out?'movein':'moveout'}" data-id="${p.id}" aria-label="Move ${out?'inside':'outside'}">${out?'🏠':'🌳'}</button>` : ''}</div></div>`;
  }).join('');
}

function viewSettings(){
  const results = searching ? `<div class="det" style="margin-top:10px">Searching…</div>`
    : searchResults.length ? `<div class="results">${searchResults.map((x,i) => `<button data-act="pickloc" data-i="${i}">${esc(x.name)} <small>${esc(x.region)}</small></button>`).join('')}</div>` : '';
  return `<header class="top"><div><h1>Settings</h1></div></header>
  <div class="section-title">Location</div>
  <div class="card">
    <div class="det">${state.location ? `Forecasts for <b style="color:var(--ink)">${esc(state.location.name)}</b>` : 'Set where your plants live to get weather alerts.'}</div>
    <form id="locForm" class="searchrow"><input id="locQ" value="${esc(searchQ)}" placeholder="Search city or town" autocomplete="off" enterkeyhint="search"><button class="btn" type="submit">Search</button></form>
    ${results}
    <button class="btn ghost wide" data-act="geo">📍 Use my current location</button>
  </div>
  <div class="section-title">Backup</div>
  <div class="card"><div class="det">Your plants are saved on this phone only. Export a backup now and then, or to move to a new phone.</div>
    <div class="acts"><button class="btn" data-act="export">Export backup</button><button class="btn ghost" data-act="import">Import backup</button></div>
    <input type="file" id="importFile" accept="application/json,.json" hidden></div>
  <div class="section-title">How alerts work</div>
  <div class="card"><ul class="howto">
    <li><b>Bring inside:</b> an outdoor plant in a movable pot, and a night in the next three is colder than its limit.</li>
    <li><b>Shelter:</b> thunderstorms or strong wind today or tomorrow, or heavy rain for plants that like to stay dry.</li>
    <li><b>Put outside:</b> an indoor plant that enjoys the outdoors, and the next three days are mild and calm.</li>
    <li><b>Watering:</b> based on your schedule. Outdoor plants get a “check the soil” note after a good rain.</li>
    <li>Care settings for each type are general starting points. Adjust them to your plant and pot.</li>
  </ul></div>
  <p class="det" style="text-align:center;margin-top:16px">Weather data by <a href="https://open-meteo.com/" style="color:inherit">Open-Meteo.com</a></p>`;
}

/* ---------- Add / edit sheet ---------- */
let editingId = null;
const tog = (id, lab, on, hint) => `<label class="tog" for="${id}"><span>${lab}<span class="th">${hint}</span></span><input type="checkbox" class="sw" id="${id}" ${on?'checked':''}></label>`;

function openSheet(id){
  const p = id ? state.plants.find(x => x.id === id) : null;
  editingId = p ? p.id : null;
  const d = p ? p : Object.assign({name:'', kind:'other', spot:'indoor', portable:true, lastWatered:today(), notes:''}, PRESETS.other);
  const opts = Object.entries(PRESETS).map(([k,v]) => `<option value="${k}" ${k===d.kind?'selected':''}>${v.emoji} ${v.label}</option>`).join('');
  $('#sheet').innerHTML = `<div class="sheethead"><button class="link cancel" data-act="close">Cancel</button>
    <div class="sheettitle">${p ? 'Edit plant' : 'New plant'}</div><button class="link" data-act="save">Save</button></div>
    <label for="f-name">Name</label><input id="f-name" value="${esc(d.name)}" placeholder="e.g. Kitchen basil" autocomplete="off">
    <label for="f-kind">Type</label><select id="f-kind">${opts}</select>
    <div class="hint">Picking a type fills in typical care. Adjust anything below.</div>
    <label>Where is it now?</label>
    <div class="seg" data-for="f-spot"><button type="button" data-act="seg" data-v="indoor" class="${d.spot==='indoor'?'on':''}">🏠 Indoors</button><button type="button" data-act="seg" data-v="outdoor" class="${d.spot==='outdoor'?'on':''}">🌳 Outdoors</button></div>
    <input type="hidden" id="f-spot" value="${d.spot}">
    <div class="row2"><div><label for="f-every">Water every (days)</label><input id="f-every" type="number" inputmode="numeric" min="1" max="90" value="${d.waterEvery}"></div>
    <div><label for="f-min">Bring in below (°F)</label><input id="f-min" type="number" min="-30" max="90" value="${d.minTemp}"></div></div>
    <label for="f-last">Last watered</label><input id="f-last" type="date" value="${d.lastWatered || ''}" max="${today()}">
    <label>Weather alerts</label>
    ${tog('f-portable','In a pot I can move', d.portable, 'Needed for bring-in and put-out alerts')}
    ${tog('f-likes','Enjoys time outdoors', d.likesOutdoors, 'Suggest putting it out when the weather’s nice')}
    ${tog('f-rain','Fine getting rained on', d.rainOk, 'Turn off for plants that hate soggy soil')}
    <label for="f-notes">Notes</label><textarea id="f-notes" rows="3" placeholder="Light, fertilizer, anything to remember">${esc(d.notes)}</textarea>
    ${p ? `<button class="btn danger wide" data-act="delete">Delete plant</button>` : ''}`;
  $('#overlay').classList.add('open');
  if(!p) setTimeout(() => $('#f-name').focus(), 50);
}
function closeSheet(){ $('#overlay').classList.remove('open'); editingId = null; }
function savePlant(){
  const nameEl = $('#f-name'), name = nameEl.value.trim();
  if(!name){ nameEl.classList.add('err'); nameEl.focus(); return; }
  const minT = parseInt($('#f-min').value, 10);
  const o = {
    name, kind: $('#f-kind').value, spot: $('#f-spot').value,
    portable: $('#f-portable').checked, likesOutdoors: $('#f-likes').checked, rainOk: $('#f-rain').checked,
    waterEvery: clamp(parseInt($('#f-every').value, 10) || 7, 1, 90),
    minTemp: clamp(isNaN(minT) ? 50 : minT, -30, 90),
    lastWatered: $('#f-last').value || null, notes: $('#f-notes').value.trim()
  };
  if(editingId) Object.assign(state.plants.find(x => x.id === editingId), o);
  else state.plants.push(Object.assign({id: uid()}, o));
  const wasNew = !editingId;
  save(); closeSheet(); render();
  toast(wasNew ? `${name} added` : 'Saved');
}

/* ---------- Toast with undo ---------- */
let toastTimer;
function toast(msg, undo){
  $('#toastMsg').textContent = msg;
  const b = $('#toastUndo'); b.hidden = !undo; b.onclick = () => { undo(); $('#toast').classList.remove('show'); };
  $('#toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 4000);
}
function change(p, fn, msg){
  const before = Object.assign({}, p);
  fn(p); save(); render();
  toast(msg, () => { Object.assign(p, before); save(); render(); });
}

/* ---------- Location ---------- */
async function doSearch(){
  searchQ = ($('#locQ')?.value || '').trim();
  if(!searchQ) return;
  searching = true; render();
  try {
    const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(searchQ)}&count=6&language=en&format=json`);
    const j = await res.json();
    searchResults = (j.results || []).map(x => ({name: x.name, region: [x.admin1, x.country_code].filter(Boolean).join(', '), short: x.admin1 || x.country || '', lat: x.latitude, lon: x.longitude}));
    if(!searchResults.length) toast('No places found. Try a nearby city.');
  } catch(e){ toast('Couldn’t search right now. Check your connection.'); }
  searching = false; render();
}
function setLocation(l){
  state.location = {name: l.short ? `${l.name}, ${l.short}` : l.name, lat: +l.lat.toFixed(3), lon: +l.lon.toFixed(3)};
  state.weather = null; searchResults = []; searchQ = ''; weatherStatus = '';
  save(); toast(`Location set to ${state.location.name}`); tab = 'today'; render(); fetchWeather(true);
}
function useGeo(){
  if(!navigator.geolocation) return toast('Location isn’t available here. Try searching instead.');
  toast('Finding your location…');
  navigator.geolocation.getCurrentPosition(
    pos => setLocation({name:'My location', short:'', lat: pos.coords.latitude, lon: pos.coords.longitude}),
    () => toast('Couldn’t get your location. Try searching instead.'),
    {timeout: 15000, maximumAge: 600000});
}

/* ---------- Backup ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({app:'plantcare', version:1, exported:new Date().toISOString(), plants:state.plants, location:state.location}, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `plant-care-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
async function importData(file){
  try {
    const j = JSON.parse(await file.text());
    if(!Array.isArray(j.plants)) throw new Error('bad');
    if(state.plants.length && !confirm(`Replace your ${state.plants.length} plant(s) with the ${j.plants.length} in this backup?`)) return;
    state.plants = j.plants.filter(p => p && p.id && p.name);
    if(j.location) { state.location = j.location; state.weather = null; }
    save(); render(); fetchWeather(true); toast(`Imported ${state.plants.length} plants`);
  } catch(e){ toast('That file doesn’t look like a plant backup.'); }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, p = el.dataset.id ? state.plants.find(x => x.id === el.dataset.id) : null;
  switch(act){
    case 'tab': tab = el.dataset.tab; render(); window.scrollTo(0,0); break;
    case 'water': if(p) change(p, x => x.lastWatered = today(), `${p.name} watered 💧`); break;
    case 'movein': if(p) change(p, x => x.spot = 'indoor', `${p.name} moved inside`); break;
    case 'moveout': if(p) change(p, x => x.spot = 'outdoor', `${p.name} moved outside`); break;
    case 'dismiss': state.dismissed[el.dataset.key] = today(); save(); render(); break;
    case 'add': openSheet(); break;
    case 'edit': openSheet(el.dataset.id); break;
    case 'close': closeSheet(); break;
    case 'save': savePlant(); break;
    case 'delete': {
      const q = state.plants.find(x => x.id === editingId);
      if(q && confirm(`Delete ${q.name}?`)){
        const idx = state.plants.indexOf(q);
        state.plants.splice(idx, 1); save(); closeSheet(); render();
        toast(`${q.name} deleted`, () => { state.plants.splice(idx, 0, q); save(); render(); });
      }
      break;
    }
    case 'seg': {
      el.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === el));
      $('#' + el.parentElement.dataset.for).value = el.dataset.v; break;
    }
    case 'refresh': weatherStatus = ''; fetchWeather(true); break;
    case 'pickloc': setLocation(searchResults[+el.dataset.i]); break;
    case 'geo': useGeo(); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
  }
});
document.addEventListener('submit', e => { if(e.target.id === 'locForm'){ e.preventDefault(); doSearch(); } });
document.addEventListener('change', e => {
  if(e.target.id === 'f-kind'){
    const pr = PRESETS[e.target.value];
    $('#f-every').value = pr.waterEvery; $('#f-min').value = pr.minTemp;
    $('#f-rain').checked = pr.rainOk; $('#f-likes').checked = pr.likesOutdoors;
    if(!$('#f-name').value.trim() && e.target.value !== 'other') $('#f-name').value = pr.label;
  }
  if(e.target.id === 'importFile' && e.target.files[0]) importData(e.target.files[0]);
});
document.addEventListener('input', e => { if(e.target.id === 'f-name') e.target.classList.remove('err'); if(e.target.id === 'locQ') searchQ = e.target.value; });
$('#overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeSheet(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden){ render(); fetchWeather(); } });

/* ---------- Start ---------- */
for(const k in state.dismissed) if(state.dismissed[k] !== today()) delete state.dismissed[k];
save(); render(); fetchWeather();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
